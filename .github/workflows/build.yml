name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.VV_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }

      # The production key lives ONLY in GitHub repository secrets (Settings > Secrets and variables > Actions):
      #   VV_KEYSTORE_BASE64   the keystore file, base64-encoded (base64 -w0 mediasaver.keystore)
      #   VV_KEYSTORE_PASSWORD, VV_KEY_ALIAS, VV_KEY_PASSWORD
      # Pull requests from forks never receive secrets, so they build an unsigned APK.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.VV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "VV_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No signing secrets: the APK will be unsigned."
          fi
      - name: Build release APK
        env:
          VV_KEYSTORE_PASSWORD: ${{ secrets.VV_KEYSTORE_PASSWORD }}
          VV_KEY_ALIAS: ${{ secrets.VV_KEY_ALIAS }}
          VV_KEY_PASSWORD: ${{ secrets.VV_KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Collect APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" VibeVault.apk
      # One rolling "latest" pre-release; only meaningful when the APK was signed with the production key.
      - name: Publish APK to the "latest" release
        if: env.HAS_KEY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --notes "Automatic build of the newest commit." --prerelease
          gh release upload latest VibeVault.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: VibeVault-apk
          path: VibeVault.apk
          retention-days: 7
      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
